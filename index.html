<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etty - Space Chess</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0ff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Starfield background */
  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    width: 100%;
    max-width: 900px;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff2daa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 20px 0 5px;
    text-shadow: 0 0 40px rgba(123, 47, 247, 0.3);
  }

  .subtitle {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 6px;
    color: #5a5a8a;
    margin-bottom: 25px;
  }

  /* Status bar */
  #status {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 10px 30px;
    border-radius: 30px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    transition: all 0.3s ease;
  }

  #status.white-turn {
    background: linear-gradient(135deg, rgba(200, 220, 255, 0.15), rgba(200, 220, 255, 0.05));
    border: 1px solid rgba(200, 220, 255, 0.3);
    color: #c8dcff;
    box-shadow: 0 0 20px rgba(200, 220, 255, 0.1);
  }

  #status.black-turn {
    background: linear-gradient(135deg, rgba(180, 100, 255, 0.15), rgba(180, 100, 255, 0.05));
    border: 1px solid rgba(180, 100, 255, 0.3);
    color: #b464ff;
    box-shadow: 0 0 20px rgba(180, 100, 255, 0.1);
  }

  #status.check {
    background: linear-gradient(135deg, rgba(255, 60, 60, 0.2), rgba(255, 60, 60, 0.05));
    border: 1px solid rgba(255, 60, 60, 0.5);
    color: #ff6666;
    box-shadow: 0 0 25px rgba(255, 60, 60, 0.2);
    animation: pulse-danger 1.5s ease-in-out infinite;
  }

  #status.gameover {
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 165, 0, 0.1));
    border: 1px solid rgba(255, 215, 0, 0.5);
    color: #ffd700;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
    animation: pulse-gold 2s ease-in-out infinite;
  }

  @keyframes pulse-danger {
    0%, 100% { box-shadow: 0 0 25px rgba(255, 60, 60, 0.2); }
    50% { box-shadow: 0 0 40px rgba(255, 60, 60, 0.4); }
  }

  @keyframes pulse-gold {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); }
    50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.4); }
  }

  /* Game area */
  .game-area {
    display: flex;
    gap: 30px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Captured pieces panels */
  .captured-panel {
    width: 110px;
    min-height: 400px;
    background: rgba(15, 15, 40, 0.6);
    border: 1px solid rgba(100, 100, 180, 0.2);
    border-radius: 12px;
    padding: 15px 10px;
    backdrop-filter: blur(10px);
  }

  .captured-panel h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  .captured-pieces {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
  }

  .captured-piece {
    font-size: 1.4rem;
    opacity: 0.5;
    transition: opacity 0.3s;
    filter: grayscale(30%);
  }

  .score-diff {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    text-align: center;
    margin-top: 10px;
    color: #7b2ff7;
    font-weight: 700;
  }

  /* Board */
  .board-container {
    position: relative;
  }

  .board-frame {
    padding: 4px;
    background: linear-gradient(135deg, #1a1a3a, #0d0d2a);
    border: 1px solid rgba(123, 47, 247, 0.3);
    border-radius: 8px;
    box-shadow:
      0 0 40px rgba(123, 47, 247, 0.15),
      inset 0 0 30px rgba(0, 0, 20, 0.5);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: 480px;
    height: 480px;
    border-radius: 4px;
    overflow: hidden;
  }

  .square {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    cursor: pointer;
    position: relative;
    transition: background 0.15s ease;
    user-select: none;
  }

  .square.light {
    background: linear-gradient(135deg, #1e2044, #252855);
  }

  .square.dark {
    background: linear-gradient(135deg, #0e0f28, #13143a);
  }

  .square:hover {
    filter: brightness(1.3);
  }

  .square.selected {
    background: radial-gradient(circle, rgba(123, 47, 247, 0.5), rgba(123, 47, 247, 0.2)) !important;
    box-shadow: inset 0 0 20px rgba(123, 47, 247, 0.4);
  }

  .square.valid-move::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle, rgba(0, 212, 255, 0.7), rgba(0, 212, 255, 0.2));
    border-radius: 50%;
    pointer-events: none;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  .square.valid-capture {
    box-shadow: inset 0 0 0 3px rgba(255, 45, 170, 0.5) !important;
  }

  .square.valid-capture::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, transparent 55%, rgba(255, 45, 170, 0.3) 65%, transparent 70%);
    pointer-events: none;
  }

  .square.last-move {
    background: linear-gradient(135deg, rgba(123, 47, 247, 0.15), rgba(123, 47, 247, 0.08)) !important;
  }

  .square.in-check {
    animation: check-flash 1s ease-in-out infinite;
    background: radial-gradient(circle, rgba(255, 40, 40, 0.4), rgba(255, 40, 40, 0.1)) !important;
  }

  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  @keyframes check-flash {
    0%, 100% { box-shadow: inset 0 0 15px rgba(255, 40, 40, 0.3); }
    50% { box-shadow: inset 0 0 30px rgba(255, 40, 40, 0.6); }
  }

  /* Pieces */
  .piece {
    position: relative;
    z-index: 2;
    text-shadow: 0 0 10px rgba(200, 200, 255, 0.4);
    transition: transform 0.1s ease;
    line-height: 1;
  }

  .piece.white-piece {
    filter: drop-shadow(0 0 6px rgba(180, 200, 255, 0.5));
    color: #dce6ff;
  }

  .piece.black-piece {
    filter: drop-shadow(0 0 6px rgba(180, 100, 255, 0.5));
    color: #9060d0;
  }

  .square:active .piece {
    transform: scale(1.15);
  }

  /* Rank and file labels */
  .board-labels-row {
    display: flex;
    padding: 0 4px;
  }

  .board-label {
    width: 60px;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: rgba(123, 47, 247, 0.5);
    padding: 4px 0;
  }

  .rank-labels {
    position: absolute;
    left: -20px;
    top: 4px;
    display: flex;
    flex-direction: column;
    height: 480px;
  }

  .rank-label {
    flex: 1;
    display: flex;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    color: rgba(123, 47, 247, 0.5);
  }

  /* Controls */
  .controls {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 2px;
    padding: 10px 24px;
    border: 1px solid rgba(123, 47, 247, 0.4);
    background: rgba(123, 47, 247, 0.1);
    color: #b8a0ff;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .btn:hover {
    background: rgba(123, 47, 247, 0.25);
    border-color: rgba(123, 47, 247, 0.7);
    box-shadow: 0 0 20px rgba(123, 47, 247, 0.2);
    color: #ddd0ff;
  }

  /* Move history */
  .move-history {
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
  }

  .move-history h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 4px;
    text-align: center;
    color: rgba(123, 47, 247, 0.5);
    margin-bottom: 10px;
  }

  .moves-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    justify-content: center;
    max-height: 80px;
    overflow-y: auto;
    padding: 10px;
    background: rgba(15, 15, 40, 0.4);
    border-radius: 8px;
    border: 1px solid rgba(100, 100, 180, 0.1);
  }

  .move-entry {
    font-family: 'Rajdhani', monospace;
    font-size: 0.85rem;
    color: #8888bb;
  }

  .move-entry .move-num {
    color: #5a5a8a;
    margin-right: 3px;
  }

  .move-entry .white-move { color: #c8dcff; }
  .move-entry .black-move { color: #b464ff; }

  /* Promotion modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.active { display: flex; }

  .promotion-modal {
    background: linear-gradient(135deg, #1a1a3a, #0d0d2a);
    border: 1px solid rgba(123, 47, 247, 0.5);
    border-radius: 16px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 60px rgba(123, 47, 247, 0.3);
  }

  .promotion-modal h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 4px;
    margin-bottom: 20px;
    color: #b8a0ff;
  }

  .promotion-options {
    display: flex;
    gap: 12px;
  }

  .promotion-option {
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    border: 1px solid rgba(123, 47, 247, 0.3);
    border-radius: 12px;
    background: rgba(123, 47, 247, 0.08);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .promotion-option:hover {
    background: rgba(123, 47, 247, 0.25);
    border-color: rgba(123, 47, 247, 0.7);
    box-shadow: 0 0 20px rgba(123, 47, 247, 0.3);
    transform: scale(1.1);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(123, 47, 247, 0.3); border-radius: 2px; }

  /* Responsive */
  @media (max-width: 750px) {
    .captured-panel { display: none; }
    #board { width: 360px; height: 360px; }
    .square { width: 45px; height: 45px; font-size: 1.8rem; }
    .board-label { width: 45px; }
    .rank-labels { height: 360px; }
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="content">
  <h1>Etty</h1>
  <div class="subtitle">Space Chess</div>

  <div id="status" class="white-turn">WHITE's TURN</div>

  <div class="game-area">
    <div class="captured-panel">
      <h3>Captured</h3>
      <div class="captured-pieces" id="captured-white"></div>
      <div class="score-diff" id="score-white"></div>
    </div>

    <div class="board-container">
      <div class="rank-labels" id="rank-labels"></div>
      <div class="board-frame">
        <div id="board"></div>
      </div>
      <div class="board-labels-row" id="file-labels"></div>
    </div>

    <div class="captured-panel">
      <h3>Captured</h3>
      <div class="captured-pieces" id="captured-black"></div>
      <div class="score-diff" id="score-black"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="newGame()">New Game</button>
    <button class="btn" onclick="undoMove()">Undo</button>
    <button class="btn" onclick="flipBoard()">Flip Board</button>
  </div>

  <div class="move-history">
    <h3>Transmissions Log</h3>
    <div class="moves-list" id="moves-list"></div>
  </div>
</div>

<div class="modal-overlay" id="promotion-modal">
  <div class="promotion-modal">
    <h2>Select Promotion</h2>
    <div class="promotion-options" id="promotion-options"></div>
  </div>
</div>

<script type="module">
import { Chess } from './node_modules/chess.js/dist/esm/chess.js';

const PIECE_SYMBOLS = {
  wp: '♙', wr: '♖', wn: '♘', wb: '♗', wq: '♕', wk: '♔',
  bp: '♟', br: '♜', bn: '♞', bb: '♝', bq: '♛', bk: '♚'
};

const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

let game = new Chess();
let selectedSquare = null;
let validMoves = [];
let boardFlipped = false;
let lastMove = null;
let pendingPromotion = null;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const movesListEl = document.getElementById('moves-list');
const promotionModal = document.getElementById('promotion-modal');
const promotionOptions = document.getElementById('promotion-options');

// --- Starfield ---
function initStarfield() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  const STAR_COUNT = 200;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.3 + 0.05,
        opacity: Math.random() * 0.8 + 0.2,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }
  }

  function draw(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Nebula glow
    const grd = ctx.createRadialGradient(
      canvas.width * 0.3, canvas.height * 0.4, 0,
      canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.5
    );
    grd.addColorStop(0, 'rgba(123, 47, 247, 0.03)');
    grd.addColorStop(0.5, 'rgba(0, 100, 200, 0.02)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (const star of stars) {
      const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
      const opacity = star.opacity * (0.7 + 0.3 * twinkle);
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 210, 255, ${opacity})`;
      ctx.fill();

      star.y += star.speed;
      if (star.y > canvas.height + 5) {
        star.y = -5;
        star.x = Math.random() * canvas.width;
      }
    }

    requestAnimationFrame(draw);
  }

  resize();
  createStars();
  requestAnimationFrame(draw);
  window.addEventListener('resize', () => { resize(); createStars(); });
}

// --- Board rendering ---
function squareToCoords(sq) {
  const file = sq.charCodeAt(0) - 97;
  const rank = parseInt(sq[1]) - 1;
  return { file, rank };
}

function coordsToSquare(file, rank) {
  return String.fromCharCode(97 + file) + (rank + 1);
}

function renderBoard() {
  boardEl.innerHTML = '';

  for (let displayRow = 0; displayRow < 8; displayRow++) {
    for (let displayCol = 0; displayCol < 8; displayCol++) {
      const rank = boardFlipped ? displayRow : 7 - displayRow;
      const file = boardFlipped ? 7 - displayCol : displayCol;
      const sq = coordsToSquare(file, rank);
      const isLight = (file + rank) % 2 === 1;

      const squareEl = document.createElement('div');
      squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
      squareEl.dataset.square = sq;

      // Last move highlight
      if (lastMove && (sq === lastMove.from || sq === lastMove.to)) {
        squareEl.classList.add('last-move');
      }

      // Selected square
      if (selectedSquare === sq) {
        squareEl.classList.add('selected');
      }

      // Valid move indicators
      const moveForSquare = validMoves.find(m => m.to === sq);
      if (moveForSquare) {
        const targetPiece = game.get(sq);
        if (targetPiece) {
          squareEl.classList.add('valid-capture');
        } else {
          squareEl.classList.add('valid-move');
        }
      }

      // Check highlight on king
      if (game.inCheck()) {
        const turn = game.turn();
        const piece = game.get(sq);
        if (piece && piece.type === 'k' && piece.color === turn) {
          squareEl.classList.add('in-check');
        }
      }

      // Piece
      const piece = game.get(sq);
      if (piece) {
        const pieceEl = document.createElement('span');
        pieceEl.className = `piece ${piece.color === 'w' ? 'white-piece' : 'black-piece'}`;
        pieceEl.textContent = PIECE_SYMBOLS[piece.color + piece.type];
        squareEl.appendChild(pieceEl);
      }

      squareEl.addEventListener('click', () => onSquareClick(sq));
      boardEl.appendChild(squareEl);
    }
  }

  renderLabels();
  updateStatus();
  updateCaptured();
  updateMoveHistory();
}

function renderLabels() {
  const fileLabels = document.getElementById('file-labels');
  const rankLabels = document.getElementById('rank-labels');
  fileLabels.innerHTML = '';
  rankLabels.innerHTML = '';

  const files = boardFlipped ? 'hgfedcba' : 'abcdefgh';
  for (const f of files) {
    const label = document.createElement('div');
    label.className = 'board-label';
    label.textContent = f;
    fileLabels.appendChild(label);
  }

  for (let i = 0; i < 8; i++) {
    const rank = boardFlipped ? i + 1 : 8 - i;
    const label = document.createElement('div');
    label.className = 'rank-label';
    label.textContent = rank;
    rankLabels.appendChild(label);
  }
}

// --- Interaction ---
function onSquareClick(sq) {
  if (game.isGameOver()) return;

  // If a valid move target was clicked
  if (selectedSquare && validMoves.find(m => m.to === sq)) {
    const moves = validMoves.filter(m => m.to === sq);

    // Check if promotion
    if (moves.some(m => m.promotion)) {
      showPromotionModal(sq, moves[0]);
      return;
    }

    makeMove(moves[0]);
    return;
  }

  // Select a piece
  const piece = game.get(sq);
  if (piece && piece.color === game.turn()) {
    selectedSquare = sq;
    validMoves = game.moves({ square: sq, verbose: true });
    renderBoard();
  } else {
    selectedSquare = null;
    validMoves = [];
    renderBoard();
  }
}

function makeMove(move) {
  const result = game.move(move);
  if (result) {
    lastMove = { from: result.from, to: result.to };
    selectedSquare = null;
    validMoves = [];
    renderBoard();
  }
}

// --- Promotion ---
function showPromotionModal(targetSq, move) {
  pendingPromotion = { from: move.from, to: targetSq };
  const color = game.turn();
  promotionOptions.innerHTML = '';

  for (const promo of ['q', 'r', 'b', 'n']) {
    const opt = document.createElement('div');
    opt.className = 'promotion-option';
    const span = document.createElement('span');
    span.className = `piece ${color === 'w' ? 'white-piece' : 'black-piece'}`;
    span.textContent = PIECE_SYMBOLS[color + promo];
    opt.appendChild(span);
    opt.addEventListener('click', () => {
      promotionModal.classList.remove('active');
      makeMove({ from: pendingPromotion.from, to: pendingPromotion.to, promotion: promo });
      pendingPromotion = null;
    });
    promotionOptions.appendChild(opt);
  }

  promotionModal.classList.add('active');
}

// --- Status ---
function updateStatus() {
  let text = '';
  let cls = '';

  if (game.isCheckmate()) {
    const winner = game.turn() === 'w' ? 'BLACK' : 'WHITE';
    text = `CHECKMATE - ${winner} WINS`;
    cls = 'gameover';
  } else if (game.isDraw()) {
    if (game.isStalemate()) text = 'STALEMATE - DRAW';
    else if (game.isThreefoldRepetition()) text = 'DRAW - REPETITION';
    else if (game.isInsufficientMaterial()) text = 'DRAW - INSUFFICIENT MATERIAL';
    else text = 'DRAW';
    cls = 'gameover';
  } else if (game.inCheck()) {
    const turn = game.turn() === 'w' ? 'WHITE' : 'BLACK';
    text = `${turn} IN CHECK`;
    cls = 'check';
  } else {
    const turn = game.turn() === 'w' ? 'WHITE' : 'BLACK';
    text = `${turn}'s TURN`;
    cls = game.turn() === 'w' ? 'white-turn' : 'black-turn';
  }

  statusEl.textContent = text;
  statusEl.className = cls;
}

// --- Captured pieces ---
function updateCaptured() {
  const history = game.history({ verbose: true });
  const capturedByWhite = []; // pieces white captured (black pieces)
  const capturedByBlack = []; // pieces black captured (white pieces)

  for (const move of history) {
    if (move.captured) {
      if (move.color === 'w') {
        capturedByWhite.push({ color: 'b', type: move.captured });
      } else {
        capturedByBlack.push({ color: 'w', type: move.captured });
      }
    }
  }

  const order = ['q', 'r', 'b', 'n', 'p'];
  capturedByWhite.sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));
  capturedByBlack.sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));

  const whiteEl = document.getElementById('captured-black');
  const blackEl = document.getElementById('captured-white');

  blackEl.innerHTML = capturedByWhite.map(p =>
    `<span class="captured-piece">${PIECE_SYMBOLS[p.color + p.type]}</span>`
  ).join('');

  whiteEl.innerHTML = capturedByBlack.map(p =>
    `<span class="captured-piece">${PIECE_SYMBOLS[p.color + p.type]}</span>`
  ).join('');

  // Score difference
  const whiteScore = capturedByWhite.reduce((s, p) => s + PIECE_VALUES[p.type], 0);
  const blackScore = capturedByBlack.reduce((s, p) => s + PIECE_VALUES[p.type], 0);
  const diff = whiteScore - blackScore;

  document.getElementById('score-white').textContent = diff > 0 ? `+${diff}` : '';
  document.getElementById('score-black').textContent = diff < 0 ? `+${Math.abs(diff)}` : '';
}

// --- Move history ---
function updateMoveHistory() {
  const history = game.history();
  movesListEl.innerHTML = '';

  for (let i = 0; i < history.length; i += 2) {
    const moveNum = Math.floor(i / 2) + 1;
    const entry = document.createElement('span');
    entry.className = 'move-entry';

    let html = `<span class="move-num">${moveNum}.</span>`;
    html += `<span class="white-move">${history[i]}</span>`;
    if (history[i + 1]) {
      html += ` <span class="black-move">${history[i + 1]}</span>`;
    }

    entry.innerHTML = html;
    movesListEl.appendChild(entry);
  }

  movesListEl.scrollTop = movesListEl.scrollHeight;
}

// --- Controls ---
window.newGame = function() {
  game = new Chess();
  selectedSquare = null;
  validMoves = [];
  lastMove = null;
  renderBoard();
};

window.undoMove = function() {
  game.undo();
  selectedSquare = null;
  validMoves = [];
  const history = game.history({ verbose: true });
  if (history.length > 0) {
    const last = history[history.length - 1];
    lastMove = { from: last.from, to: last.to };
  } else {
    lastMove = null;
  }
  renderBoard();
};

window.flipBoard = function() {
  boardFlipped = !boardFlipped;
  renderBoard();
};

// --- Init ---
initStarfield();
renderBoard();
</script>
